# Full local stack:  docker compose up --build
#   API      http://localhost:8000/docs
#   UI       http://localhost:8501
#   Grafana  http://localhost:3000  (admin / admin)
#   Prometheus http://localhost:9090
# Optional profiles:
#   docker compose --profile streaming up   -> + Kafka + streaming consumer
#   docker compose --profile gpu up         -> + vLLM self-hosted model (needs NVIDIA GPU)

x-app-env: &app-env
  LLM_PROVIDER: ${LLM_PROVIDER:-offline}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hf}
  CHROMA_MODE: http
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  DATABASE_URL: postgresql+psycopg://pp:pp@postgres:5432/paperpilot
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  KAFKA_BOOTSTRAP: kafka:9092

services:
  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      chroma: {condition: service_started}

  worker:                      # Celery worker + beat scheduler (async ingestion, feature jobs)
    build: .
    command: celery -A app.workers.tasks worker -B --loglevel=info --concurrency=2
    environment: *app-env
    depends_on: [api]

  ui:
    build: {context: ., dockerfile: Dockerfile.ui}
    environment: {API_URL: "http://api:8000"}
    ports: ["8501:8501"]
    depends_on: [api]

  chroma:
    image: chromadb/chroma:1.5.9
    volumes: [chroma_data:/data]

  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: pp, POSTGRES_PASSWORD: pp, POSTGRES_DB: paperpilot}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ---------------- optional: streaming ----------------
  kafka:
    profiles: [streaming]
    image: apache/kafka:3.8.0          # KRaft mode, no ZooKeeper
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

  stream-consumer:
    profiles: [streaming]
    build: .
    command: sh -c "pip install --user kafka-python && python -m app.streaming.kafka_pipeline consume"
    environment: *app-env
    depends_on: [kafka, api]

  # ---------------- optional: self-hosted model serving ----------------
  vllm:
    profiles: [gpu]
    image: vllm/vllm-openai:latest
    command: --model mistralai/Mistral-7B-Instruct-v0.3 --max-model-len 8192
    environment: {HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"}
    ports: ["8001:8000"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  chroma_data:
  pg_data:
