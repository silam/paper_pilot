apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: paperpilot, labels: {app: api}}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}   # zero-downtime deploys
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_GH_USER/paperpilot:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: paperpilot-config}}, {secretRef: {name: paperpilot-secrets}}]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: paperpilot}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: paperpilot}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperpilot
  namespace: paperpilot
  annotations: {nginx.ingress.kubernetes.io/limit-rps: "20"}
spec:
  ingressClassName: nginx
  rules:
    - host: paperpilot.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
