# Stateful dependencies for a self-contained demo cluster (kind / minikube).
# In the cloud, prefer managed services: RDS/Cloud SQL, ElastiCache/Memorystore,
# and a managed vector DB (Pinecone) or Chroma on a StatefulSet with backups.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: chroma, namespace: paperpilot}
spec:
  serviceName: chroma
  replicas: 1
  selector: {matchLabels: {app: chroma}}
  template:
    metadata: {labels: {app: chroma}}
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:1.5.9
          ports: [{containerPort: 8000}]
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: chroma, namespace: paperpilot}
spec: {selector: {app: chroma}, ports: [{port: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: paperpilot}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers: [{name: redis, image: "redis:7-alpine", ports: [{containerPort: 6379}]}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: paperpilot}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: paperpilot}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: pp}
            - {name: POSTGRES_PASSWORD, value: pp}
            - {name: POSTGRES_DB, value: paperpilot}
          volumeMounts: [{name: pg, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: pg}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: paperpilot}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
