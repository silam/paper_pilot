# CI/CD: lint -> unit tests -> LLM eval quality gate -> build & push image -> (deploy)
name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app eval tests
      - name: Unit + API tests (offline LLM, hash embeddings - no secrets needed)
        run: pytest -q

  eval-gate:
    # Prompt/retrieval changes can silently degrade quality. This job fails the
    # PR if hit@k, groundedness, refusal accuracy or red-team blocking regress.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m app.ingestion.pipeline --source sample
      - run: python -m eval.run_eval --gate
      - run: python -m eval.run_eval --compare rag_v1 rag_v2_fewshot
      - uses: actions/upload-artifact@v4
        with: {name: eval-results, path: eval/results/}

  build-push:
    needs: eval-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # deploy: kubectl set image deployment/api api=ghcr.io/...:${{ github.sha }}
  # (or ArgoCD watching the k8s/ folder - GitOps)
